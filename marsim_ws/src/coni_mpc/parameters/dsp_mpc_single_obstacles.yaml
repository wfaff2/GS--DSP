# Dedicated perception-driven MPC scene.
#
# The static obstacles are supplied separately by
# A2_three_square_prisms_l_wall_near_uav.pcd.
# This file defines two deterministic moving rectangular obstacles for the
# MARSIM LiDAR renderer aligned with the R_ugv = 7.0 m (R_uav = 5.5 m,
# T_lap = 44.0 s, startup_delay = 3.0 s) circular orbit. Their X positions
# are shifted toward the nominal UAV orbit while retaining the original
# crossing directions and speeds. The vertical extent is z = 0--2.3 m.
dynamic:
  count: 2
  initial: [[4.05, 1.56, 1.15], [-5.50, -21.60, 1.15]]
  size: [[0.6, 0.6, 2.3], [0.6, 0.6, 2.3]]
  velocity: [[0.0, -0.60, 0.0], [0.0, 0.60, 0.0]]
  initial_flat: [4.05, 1.56, 1.15, -5.50, -21.60, 1.15]
  size_flat: [0.6, 0.6, 2.3, 0.6, 0.6, 2.3]
  velocity_flat: [0.0, -0.60, 0.0, 0.0, 0.60, 0.0]
